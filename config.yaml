          note: ''
        - query: methods for spatial reasoning and scene comprehension
          query_cn: 空间推理与场景理解的方法
          enabled: true
          source: manual
          note: ''
        - query: models for 3D scene understanding and spatial perception
          query_cn: 用于三维场景理解与空间感知的模型
          enabled: true
          source: manual
          note: ''
        - query: research on embodied spatial intelligence and scene interpretation
          query_cn: 具身空间智能与场景解释的研究
          enabled: true
