    - tag: dr
      description: 帮我查找动态三维重建的论文
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: 4D reconstruction
          keyword_cn: 四维重建
          query: four-dimensional reconstruction of dynamic geometry over time
        - keyword: 3dgs
          keyword_cn: ''
          query: '3'
        - keyword: vggt
          keyword_cn: ''
          query: v
        - keyword: dynamic 3D reconstruction
          keyword_cn: 动态三维重建
          query: reconstructing dynamic three-dimensional scenes from images or sensor data over time
        - keyword: temporal 3D reconstruction
          keyword_cn: 时序三维重建
          query: temporal modeling for three-dimensional reconstruction of moving objects and scenes
        - keyword: real-time dynamic reconstruction
          keyword_cn: 实时动态重建
          query: real-time reconstruction of dynamic 3D objects and scenes
      intent_queries:
        - query: papers on dynamic 3D reconstruction that recover time varying geometry from video or sensor sequences
          query_cn: 从视频或传感器序列中恢复时变几何的动态三维重建论文
          enabled: true
          source: manual
          note: ''
        - query: methods for non rigid and deformable 3D reconstruction of moving objects
          query_cn: 运动物体非刚性和可变形三维重建方法
          enabled: true
          source: manual
          note: ''
        - query: dynamic neural radiance fields and Gaussian splatting for reconstructing dynamic scenes
          query_cn: 用于动态场景重建的动态神经辐射场和高斯泼溅
          enabled: true
          source: manual
          note: ''
        - query: real time dynamic scene reconstruction and scene flow estimation from image streams
          query_cn: 从图像流进行实时动态场景重建和场景流估计
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-10-02T03:25:17.530Z'
    - tag: spatial-ai
